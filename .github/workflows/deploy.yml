name: Deploy

# Production deploys. Vercel's own Git integration must be turned off for
# this project (Vercel → Settings → Git → Ignored Build Step, or disconnect
# the repo), otherwise every push deploys twice and the migration ordering
# below is not guaranteed.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys interleave — one could be mid-migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy
    runs-on: ubuntu-latest
    environment: production

    env:
      # The Vercel CLI reads all three of these from the environment.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      DB_SCHEMA: ${{ vars.DB_SCHEMA || 'rt_prod' }}

    steps:
      # Fail here with a readable message rather than deep inside the Vercel
      # CLI or Prisma with an empty connection string.
      - name: Check required secrets
        run: |
          missing=""
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID DATABASE_URL DIRECT_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see the Deployment section of README.md"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production

      # Build before touching the database: a broken build should never leave
      # a migrated database behind.
      - name: Build
        run: vercel build --prod

      - name: Show pending migrations
        run: npm run db:status

      # Migrations run before the new code goes live, so the deployment never
      # serves against a schema it does not expect. Additive migrations keep
      # this safe for the moments when old and new code overlap.
      - name: Apply migrations
        run: npm run db:deploy

      - name: Deploy
        run: vercel deploy --prebuilt --prod
